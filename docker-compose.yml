services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-ai-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Optional local LLM fallback container:
  # Run with: docker compose --profile local-llm up --build
  ollama:
    image: ollama/ollama:latest
    container_name: mini-ai-gateway-ollama
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
